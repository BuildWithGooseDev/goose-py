[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goose-sdk"
dynamic = ["version"]
description = "Python SDK for Goose config service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "twine>=5.1.1",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "goose_sdk._version.__version__"}

[tool.setuptools.package-data]
goose_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
